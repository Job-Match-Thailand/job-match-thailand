version: "3.9"
services:
  postgres_db:
    image: postgres:14
    container_name: job-match-db
    restart: always
    command: -p 5433
    env_file:
      - backend/.env
    expose:
      - 5433
    ports:
      - "5433:5433"
    volumes:
      - job_match_db_data:/var/lib/postgresql/data/
  minio:
    image: minio/minio
    container_name: job-match-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - job_match_minio_storage:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: jobmatchadminsecret
    command: server --console-address ":9001" /data
  redis:
    image: redis:7.2.3
    container_name: job-match-redis
    command: redis-server
    volumes:
      - job_match_redis:/var/lib/redis
      - job_match_redis_config:/usr/local/etc/redis/redis.conf
    ports:
      - 6379:6379
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: job-match-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=root
      - HTTP_PASSWORD=qwerty
    ports:
      - 8081:8081

volumes:
  job_match_db_data:
  job_match_minio_storage:
  job_match_redis:
  job_match_redis_config: